name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  dominio:
    name: Dominio y analisis (JUnit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: mvn -B -f backend/pom.xml verify

  base-de-datos:
    name: Esquema y pruebas SQL (PostgreSQL 16)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: hogar
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: hogar
    steps:
      - uses: actions/checkout@v4
      - run: psql -v ON_ERROR_STOP=1 -q -f db/migration/V1__esquema_inicial.sql
      - run: psql -v ON_ERROR_STOP=1 -q -f db/pruebas/pruebas_esquema.sql
